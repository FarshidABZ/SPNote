// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral() // Added because many legacy artifacts moved from JCenter to Maven Central
        // jcenter() // Deprecated: do not re-enable unless absolutely necessary
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1' // Upgraded AGP to work with Gradle 8.x and modern JDK
        classpath 'com.google.gms:google-services:4.4.2' // Upgraded Google Services plugin
        // classpath 'io.fabric.tools:gradle:1.31.0' // Commented out: Fabric Crashlytics is EOL; use Firebase Crashlytics if needed
    }
}

allprojects {
    repositories {
        google()
        mavenCentral() // Added missing repo to resolve AndroidX and other artifacts
        // jcenter() // Deprecated / read-only; enable only if an artifact is not found elsewhere
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
